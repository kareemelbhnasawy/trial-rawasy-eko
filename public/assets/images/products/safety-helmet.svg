<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="helmetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="visorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="shadowGradient" cx="50%" cy="100%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#F8FAFC"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="280" rx="120" ry="15" fill="url(#shadowGradient)"/>
  
  <!-- Helmet main body -->
  <path d="M100 140 Q100 80 200 80 Q300 80 300 140 L300 160 Q300 200 280 220 L120 220 Q100 200 100 160 Z" 
        fill="url(#helmetGradient)" stroke="#D97706" stroke-width="2"/>
  
  <!-- Helmet brim -->
  <ellipse cx="200" cy="175" rx="110" ry="15" fill="url(#helmetGradient)" opacity="0.9"/>
  <ellipse cx="200" cy="175" rx="105" ry="12" fill="none" stroke="#D97706" stroke-width="1"/>
  
  <!-- Safety visor -->
  <rect x="140" y="120" width="120" height="35" fill="url(#visorGradient)" rx="17" opacity="0.8"/>
  <rect x="145" y="125" width="110" height="25" fill="none" stroke="#1F2937" stroke-width="1" rx="12"/>
  
  <!-- Ventilation holes -->
  <circle cx="150" cy="110" r="3" fill="#B45309"/>
  <circle cx="165" cy="105" r="3" fill="#B45309"/>
  <circle cx="180" cy="102" r="3" fill="#B45309"/>
  <circle cx="220" cy="102" r="3" fill="#B45309"/>
  <circle cx="235" cy="105" r="3" fill="#B45309"/>
  <circle cx="250" cy="110" r="3" fill="#B45309"/>
  
  <!-- Chin strap -->
  <path d="M120 190 Q140 210 160 200" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 190 Q260 210 240 200" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Chin strap buckle -->
  <rect x="195" y="205" width="10" height="8" fill="#6B7280" rx="2"/>
  <rect x="197" y="207" width="6" height="4" fill="#374151" rx="1"/>
  
  <!-- Suspension system (inside) -->
  <path d="M120 140 Q160 130 200 130 Q240 130 280 140" fill="none" stroke="#6B7280" stroke-width="2" opacity="0.6"/>
  <path d="M130 160 Q170 150 200 150 Q230 150 270 160" fill="none" stroke="#6B7280" stroke-width="2" opacity="0.6"/>
  
  <!-- 3M Logo -->
  <rect x="170" y="160" width="60" height="20" fill="white" opacity="0.9" rx="5"/>
  <text x="200" y="175" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="16" font-weight="bold">3M</text>
  
  <!-- Safety certification mark -->
  <circle cx="320" cy="100" r="25" fill="white" opacity="0.9"/>
  <circle cx="320" cy="100" r="20" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="8" font-weight="bold">ANSI</text>
  <text x="320" y="105" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Z89.1</text>
  
  <!-- Type I Class E marking -->
  <rect x="80" y="90" width="40" height="25" fill="white" opacity="0.9" rx="5"/>
  <text x="100" y="100" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="7" font-weight="bold">TYPE I</text>
  <text x="100" y="110" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="7" font-weight="bold">CLASS E</text>
  
  <!-- Helmet highlight -->
  <ellipse cx="180" cy="120" rx="40" ry="20" fill="white" opacity="0.3"/>
  
  <!-- Product title -->
  <text x="200" y="40" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Safety Hard Hat - ANSI Z89.1</text>
  <text x="200" y="60" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="14">Type I Class E - Electrical Protection</text>
  
  <!-- Features box -->
  <rect x="20" y="240" width="360" height="40" fill="white" opacity="0.95" rx="8" stroke="#E5E7EB"/>
  <text x="30" y="255" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Features:</text>
  <text x="30" y="270" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">• Impact Protection • Electrical Safety (20,000V) • 6-Point Suspension • Lightweight Design</text>
</svg>
