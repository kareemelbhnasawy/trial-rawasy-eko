<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="vendor3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#vendor3Gradient)" stroke="#7F1D1D" stroke-width="2"/>
  
  <!-- Concrete mixer -->
  <ellipse cx="40" cy="45" rx="22" ry="12" fill="white" opacity="0.9"/>
  <rect x="30" y="33" width="20" height="12" fill="white" opacity="0.9" rx="2"/>
  
  <!-- Mixer drum detail -->
  <ellipse cx="40" cy="40" rx="15" ry="9" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  
  <!-- Support structure -->
  <rect x="38" y="48" width="4" height="6" fill="white" opacity="0.8"/>
  
  <!-- Company name -->
  <text x="40" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">CEMEX</text>
  
  <!-- Top accent -->
  <text x="40" y="18" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">C</text>
</svg>
