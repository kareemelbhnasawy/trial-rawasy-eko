<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="vendor4Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#vendor4Gradient)" stroke="#B45309" stroke-width="2"/>
  
  <!-- Power drill -->
  <rect x="22" y="35" width="25" height="5" fill="#1F2937" opacity="0.9" rx="2"/>
  <rect x="43" y="32" width="10" height="11" fill="#1F2937" opacity="0.9" rx="1"/>
  <circle cx="48" cy="37.5" r="5" fill="#1F2937" opacity="0.7"/>
  
  <!-- Drill bit -->
  <rect x="18" y="36" width="5" height="3" fill="#6B7280"/>
  
  <!-- Handle -->
  <rect x="32" y="40" width="4" height="10" fill="#1F2937" opacity="0.8" rx="2"/>
  
  <!-- Trigger -->
  <rect x="28" y="42" width="5" height="3" fill="#DC2626" rx="1"/>
  
  <!-- Company name -->
  <text x="40" y="68" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="6" font-weight="bold">DeWALT</text>
  
  <!-- Brand mark -->
  <text x="40" y="18" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="10" font-weight="bold">DW</text>
</svg>
