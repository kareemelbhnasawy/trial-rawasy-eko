<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="vendor8Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#vendor8Gradient)" stroke="#064E3B" stroke-width="2"/>
  
  <!-- Wood planks -->
  <rect x="18" y="30" width="44" height="5" fill="#D2691E" opacity="0.9" rx="1"/>
  <rect x="18" y="37" width="44" height="5" fill="#CD853F" opacity="0.9" rx="1"/>
  <rect x="18" y="44" width="44" height="5" fill="#DEB887" opacity="0.9" rx="1"/>
  
  <!-- Wood grain lines -->
  <line x1="20" y1="32" x2="60" y2="32" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="39" x2="60" y2="39" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="46" x2="60" y2="46" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Tree symbol -->
  <polygon points="40,18 37,25 43,25" fill="white" opacity="0.9"/>
  <rect x="38" y="25" width="4" height="5" fill="white" opacity="0.7"/>
  
  <!-- Company name -->
  <text x="40" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">G-P</text>
  
  <!-- Wood end grain circles -->
  <circle cx="22" cy="32" r="1" fill="#8B4513" opacity="0.4"/>
  <circle cx="58" cy="39" r="1" fill="#8B4513" opacity="0.4"/>
  <circle cx="22" cy="46" r="1" fill="#8B4513" opacity="0.4"/>
</svg>
