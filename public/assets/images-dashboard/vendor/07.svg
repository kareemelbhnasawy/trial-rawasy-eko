<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="vendor7Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#vendor7Gradient)" stroke="#0F172A" stroke-width="2"/>
  
  <!-- Electric cable coil -->
  <circle cx="40" cy="40" r="16" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <circle cx="40" cy="40" r="11" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <circle cx="40" cy="40" r="6" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  
  <!-- Cable end -->
  <rect x="53" y="37" width="5" height="4" fill="white" opacity="0.9" rx="2"/>
  
  <!-- Lightning symbol -->
  <polygon points="37,25 43,32 40,32 46,38 40,32 37,32" fill="#FCD34D"/>
  
  <!-- Cable connector -->
  <rect x="22" y="37" width="5" height="4" fill="white" opacity="0.9" rx="2"/>
  
  <!-- Company name -->
  <text x="40" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="5" font-weight="bold">SOUTHWIRE</text>
  
  <!-- Brand mark -->
  <text x="40" y="18" text-anchor="middle" fill="#FCD34D" font-family="Arial, sans-serif" font-size="8" font-weight="bold">SW</text>
</svg>
