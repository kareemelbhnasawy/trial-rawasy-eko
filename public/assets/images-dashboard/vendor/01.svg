<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="vendor1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#vendor1Gradient)" stroke="#0F172A" stroke-width="2"/>
  
  <!-- Steel beam structure -->
  <rect x="15" y="30" width="50" height="5" fill="white" opacity="0.9"/>
  <rect x="15" y="38" width="50" height="5" fill="white" opacity="0.9"/>
  <rect x="15" y="46" width="50" height="5" fill="white" opacity="0.9"/>
  
  <!-- Vertical support -->
  <rect x="37" y="20" width="6" height="40" fill="white" opacity="0.8"/>
  
  <!-- Company initials -->
  <text x="40" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">EZZ</text>
  
  <!-- Steel industry symbol -->
  <polygon points="32,23 48,23 45,16 35,16" fill="#F59E0B"/>
</svg>
